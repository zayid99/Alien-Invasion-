<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/">
<title>Model comparison</title>
<style>
  body { margin: 0; background: #0f0828; color: #fff6e0; font: 600 15px/1.3 system-ui, sans-serif; }
  body > canvas:not(#r) { display: none !important; }
  #grid { display: grid; grid-template-columns: 150px repeat(4, 360px); gap: 6px; padding: 10px; width: max-content; }
  .h { font: 800 17px system-ui; padding: 6px 4px; text-align: center; }
  .h.cur { color: #ffb38a; } .h.bl { color: #9cff3f; }
  .name { display: flex; flex-direction: column; justify-content: center; padding: 6px; font-size: 17px; }
  .name small { font-weight: 500; font-size: 12px; opacity: .75; margin-top: 4px; }
  img { width: 360px; height: 300px; border-radius: 8px; display: block; }
  .cell { position: relative; }
  .cell span { position: absolute; left: 6px; bottom: 6px; font-size: 11px; background: #1a1033cc; padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<canvas id="game" style="display:none"></canvas>
<div id="grid"></div>
<script type="module" src="/tools/compare/compare.ts"></script>
</body>
</html>
